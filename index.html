<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Practicals</title>
<style>
:root{--bg:#f2f4f7;--ink:#1a2735;--mute:#5d6b7a;--line:#d5dce4;--accent:#1f4fb4;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ink);color:#fff;padding:20px 16px}
.wrap{max-width:1100px;margin:0 auto}
h1{margin:0;font-size:1.5rem}
main{padding:20px 16px 48px}
input[type=search]{width:100%;max-width:420px;padding:12px 14px;font-size:1rem;border:1px solid var(--line);border-radius:8px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;padding:0;text-align:left;font:inherit;color:inherit}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:2px solid var(--accent)}
.card img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#e4e9ee}
.card span{display:block;padding:10px 12px;font-weight:600}
.card small{display:block;padding:0 12px 10px;color:var(--mute);font-weight:400}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumbs button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#fff}
.thumbs button:focus-visible{outline:2px solid var(--accent)}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:12px}
h2{margin:0 0 16px}
.msg{color:var(--mute);padding:24px 0}
#lb{position:fixed;inset:0;background:rgba(10,15,22,.96);display:none;align-items:center;justify-content:center;z-index:10;touch-action:pan-y}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb button{position:absolute;background:rgba(255,255,255,.15);color:#fff;border:0;font-size:1.6rem;width:48px;height:48px;border-radius:50%;cursor:pointer}
#lb button:hover,#lb button:focus-visible{background:rgba(255,255,255,.35)}
#prev{left:10px;top:50%;margin-top:-24px}
#next{right:10px;top:50%;margin-top:-24px}
#close{right:10px;top:10px}
#count{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:.9rem}
</style>
</head>
<body>
<header><div class="wrap"><h1>My Practicals</h1></div></header>
<main class="wrap" id="app"></main>

<div id="lb" role="dialog" aria-label="Image viewer">
  <button id="close" aria-label="Close">&times;</button>
  <button id="prev" aria-label="Previous image">&#8249;</button>
  <img id="big" alt="">
  <button id="next" aria-label="Next image">&#8250;</button>
  <div id="count"></div>
</div>

<script>
// ---- SETTINGS (only change if the site doesn't find your images) ----
const GITHUB_USER = "";   // e.g. "rahul123"  (leave empty to auto-detect on GitHub Pages)
const GITHUB_REPO = "";   // e.g. "practicals" (leave empty to auto-detect)
const BRANCH = "main";
const FOLDER = "practicals";
// ----------------------------------------------------------------------

const app = document.getElementById("app");
const IMG = /\.(jpe?g|png|gif|webp|avif)$/i;
const nat = (a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: "base"});
const url = p => p.split("/").map(encodeURIComponent).join("/");
let data = {}; // { practicalName: [imagePath, ...] }
let imgs = [], idx = 0;

function detect() {
  let u = GITHUB_USER, r = GITHUB_REPO;
  if ((!u || !r) && location.hostname.endsWith(".github.io")) {
    u = u || location.hostname.split(".")[0];
    r = r || location.pathname.split("/")[1] || location.hostname;
  }
  return {u, r};
}

async function load() {
  const {u, r} = detect();
  if (!u || !r) throw new Error("Set GITHUB_USER and GITHUB_REPO at the top of index.html.");
  const key = "tree:" + u + "/" + r;
  let tree;
  try {
    const c = JSON.parse(sessionStorage.getItem(key));
    if (c && Date.now() - c.t < 120000) tree = c.tree;
  } catch (e) {}
  if (!tree) {
    const res = await fetch(`https://api.github.com/repos/${u}/${r}/git/trees/${BRANCH}?recursive=1`);
    if (!res.ok) throw new Error("Could not read the image list from GitHub (error " + res.status + "). Try again in a few minutes.");
    tree = (await res.json()).tree;
    try { sessionStorage.setItem(key, JSON.stringify({t: Date.now(), tree})); } catch (e) {}
  }
  const out = {};
  tree.forEach(n => {
    if (n.type !== "blob" || !n.path.startsWith(FOLDER + "/") || !IMG.test(n.path)) return;
    const parts = n.path.split("/");
    if (parts.length < 3) return;
    (out[parts[1]] = out[parts[1]] || []).push(n.path);
  });
  Object.keys(out).forEach(k => out[k].sort((a, b) => nat(a, b)));
  return out;
}

function cover(list) {
  return list.find(p => /\/cover\.[a-z]+$/i.test(p)) || list[0];
}

function home(query = "") {
  const q = query.trim().toLowerCase();
  const names = Object.keys(data).sort(nat).filter(n => n.toLowerCase().includes(q));
  app.innerHTML = `<input type="search" id="q" placeholder="Search practicals by name" aria-label="Search practicals" value="">
    <div class="grid" id="grid"></div>`;
  const qi = document.getElementById("q");
  qi.value = query;
  qi.oninput = () => { home(qi.value); const e = document.getElementById("q"); e.focus(); e.setSelectionRange(e.value.length, e.value.length); };
  const grid = document.getElementById("grid");
  if (!names.length) { grid.outerHTML = `<p class="msg">${Object.keys(data).length ? "No practical matches your search." : "No practicals yet. Upload images into the “practicals” folder on GitHub."}</p>`; return; }
  names.forEach(n => {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = `<img loading="lazy" alt=""><span></span><small>${data[n].length} images</small>`;
    b.querySelector("img").src = url(cover(data[n]));
    b.querySelector("span").textContent = n;
    b.onclick = () => { location.hash = encodeURIComponent(n); };
    grid.appendChild(b);
  });
}

function gallery(name) {
  const list = data[name];
  if (!list) { location.hash = ""; return; }
  app.innerHTML = `<button class="back">&larr; All practicals</button><h2></h2><div class="thumbs"></div>`;
  app.querySelector("h2").textContent = name;
  app.querySelector(".back").onclick = () => { location.hash = ""; };
  const box = app.querySelector(".thumbs");
  list.forEach((p, i) => {
    const b = document.createElement("button");
    b.setAttribute("aria-label", "Open image " + (i + 1));
    b.innerHTML = `<img loading="lazy" alt="">`;
    b.firstChild.src = url(p);
    b.onclick = () => openLb(list, i);
    box.appendChild(b);
  });
  window.scrollTo(0, 0);
}

function route() {
  closeLb();
  const h = decodeURIComponent(location.hash.slice(1));
  h ? gallery(h) : home();
}

const lb = document.getElementById("lb"), big = document.getElementById("big"), count = document.getElementById("count");
function show() {
  big.src = url(imgs[idx]);
  count.textContent = (idx + 1) + " / " + imgs.length;
}
function openLb(list, i) { imgs = list; idx = i; show(); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
function closeLb() { lb.classList.remove("open"); document.body.style.overflow = ""; }
function step(d) { idx = (idx + d + imgs.length) % imgs.length; show(); }
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("close").onclick = closeLb;
lb.onclick = e => { if (e.target === lb) closeLb(); };
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "Escape") closeLb();
});
let sx = null;
lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, {passive: true});
lb.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  sx = null;
});

app.innerHTML = '<p class="msg">Loading…</p>';
load().then(d => { data = d; window.addEventListener("hashchange", route); route(); })
      .catch(err => { app.innerHTML = '<p class="msg"></p>'; app.firstChild.textContent = err.message; });
</script>
</body>
</html>
